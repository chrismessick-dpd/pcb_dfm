        <span>All tools<small>Dovetail Signoff home</small></span>
      </a>
    </div>
    <a class="side-link" id="people-link" href="../ee_design_review/index.html?page=people" title="People and access, kept in Signoff EE" hidden>

      <div class="privacy" title="Packages are read and checked inside this browser tab. Nothing is uploaded.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Files stay in this browser</span>
      </div>
      <button class="icon-btn" data-act="theme" id="theme-btn" title="Dark mode" aria-label="Toggle dark mode"></button>
    </div>

  <main class="main" id="main">
    <header class="toolbar" id="toolbar">
      <button class="icon-btn menu-toggle" data-act="nav" title="Show sidebar ( [ )" aria-label="Show sidebar">

      </button>
      <div class="toolbar-center"><div class="seg" id="view-seg" role="tablist"></div></div>
      <div class="toolbar-actions" id="toolbar-actions">
        <button class="btn btn-primary" data-act="open"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6M2.5 10v2.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V10"/></svg><span class="btn-label">Open</span></button>
      </div>
    </header>
    <div id="page"></div>
    <section class="board-view" id="board-view" hidden>
      <div class="layers-pane" id="layers-pane"></div>
      <div class="board" id="board-wrap">
        <canvas id="canvas"></canvas>
        <div class="board-hud">
          <div class="seg" id="side-seg"><button data-side="top" class="on">Top</button><button data-side="bottom">Bottom</button></div>
          <div class="seg"><button data-act="fit">Fit</button></div>
          <div class="seg"><button id="pnp-btn" class="on" data-act="pnp">Placements</button></div>
        </div>
        <div class="tip" id="tip"></div>
        <div class="coords" id="coords">–</div>
      </div>
      <aside class="rail" id="rail"></aside>
    </section>
  </main>
